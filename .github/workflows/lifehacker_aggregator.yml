name: Lifehacker Content Aggregator

on:
  schedule:
    # Runs 4 times during Sri Lanka evening/night hours: 5:30 PM, 8:30 PM, 11:30 PM, and 2:30 AM IST
    - cron: '0 12,15,18,21 * * *'
  workflow_dispatch: # Allows manual trigger or external pinger calls

permissions:
  contents: write

jobs:
  run-aggregator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser google-genai

      - name: Execute Lifehacker Aggregator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python lifehacker_aggregator.py

      - name: Commit Updated History Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lifehacker_history.txt || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Lifehacker history log [skip ci]" && git push)
